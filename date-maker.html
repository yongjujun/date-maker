<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>DATE MAKER — 둘의 작은 선택이 오늘의 데이트가 됩니다</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#FAF6F2;
    --card:#FFFFFF;
    --text:#1C1B1A;
    --text-2:#8B8783;
    --text-3:#B6B1AC;
    --accent:#E2637A;
    --accent-deep:#C94F67;
    --accent-bg:#FCECEF;
    --accent-bg-2:#F7E1E6;
    --border:#EDE8E2;
    --dark:#1C1B1A;
    --blue:#7C93C9;
    --blue-bg:#EEF1F9;
    --r-lg:24px;
    --r-md:20px;
    --r-sm:14px;
    --r-xs:10px;
    --shadow-sm:0 2px 10px rgba(28,27,26,0.05);
    --shadow-md:0 8px 28px rgba(28,27,26,0.10);
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,Roboto,sans-serif;
    background:#EDE6DD;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  #stage{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
  }
  #app-frame{
    position:relative;
    width:100%;
    max-width:430px;
    height:100vh;
    height:100dvh;
    background:var(--bg);
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  @media (min-width:520px){
    #stage{ padding:32px 0; }
    #app-frame{
      height:min(900px, 94vh);
      border-radius:44px;
      box-shadow:0 30px 80px rgba(28,27,26,0.28), 0 0 0 10px #14130F;
      border:1px solid rgba(0,0,0,0.06);
    }
    #app-frame::before{
      content:"";
      position:absolute;
      top:14px; left:50%; transform:translateX(-50%);
      width:110px; height:26px;
      background:#14130F;
      border-radius:0 0 16px 16px;
      z-index:50;
    }
  }
  #app{
    flex:1;
    overflow-y:auto;
    overflow-x:hidden;
    display:flex;
    flex-direction:column;
    -ms-overflow-style:none;
    scrollbar-width:none;
    position:relative;
  }
  #app::-webkit-scrollbar{ display:none; }

  .screen{
    flex:1;
    display:flex;
    flex-direction:column;
    min-height:100%;
    padding:calc(20px + var(--safe-top)) 24px calc(24px + var(--safe-bottom));
    animation:fadeSlideUp .38s cubic-bezier(.22,.61,.36,1);
  }
  @keyframes fadeSlideUp{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes popIn{
    from{ opacity:0; transform:scale(.94); }
    to{ opacity:1; transform:scale(1); }
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    min-height:32px;
    margin-bottom:6px;
  }
  .back-btn{
    width:32px; height:32px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    background:transparent;
    border:none;
    cursor:pointer;
    color:var(--text);
    font-size:18px;
    padding:0;
  }
  .back-btn:active{ background:rgba(0,0,0,0.05); }
  .icon-btn{
    width:32px; height:32px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    background:transparent;
    border:none;
    cursor:pointer;
    color:var(--text);
    font-size:16px;
  }

  h1.h-xl{ font-size:26px; font-weight:800; line-height:1.35; letter-spacing:-0.4px; margin:0; }
  h1.h-lg{ font-size:22px; font-weight:800; line-height:1.4; letter-spacing:-0.3px; margin:0; }
  p.sub{ font-size:14.5px; color:var(--text-2); line-height:1.55; margin:10px 0 0; }
  p.sub-sm{ font-size:13px; color:var(--text-2); line-height:1.5; margin:6px 0 0; }

  .grow{ flex:1; }
  .spacer{ flex:1; min-height:16px; }

  .btn-primary{
    width:100%;
    background:var(--dark);
    color:#fff;
    border:none;
    border-radius:18px;
    padding:17px 20px;
    font-size:16px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
    transition:transform .15s ease, opacity .2s ease, background .2s ease;
    font-family:inherit;
  }
  .btn-primary:active{ transform:scale(0.98); }
  .btn-primary:disabled{ background:#D9D5CF; color:#fff; cursor:not-allowed; }
  .btn-primary.accent{ background:var(--accent); }
  .btn-primary.accent:disabled{ background:#F3C6CF; }

  .btn-secondary{
    width:100%;
    background:transparent;
    color:var(--text);
    border:1.5px solid var(--border);
    border-radius:18px;
    padding:15.5px 20px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:transform .15s ease, background .2s ease;
    font-family:inherit;
  }
  .btn-secondary:active{ transform:scale(0.98); background:rgba(0,0,0,0.03); }

  .btn-ghost{
    width:100%;
    background:transparent;
    color:var(--text-2);
    border:none;
    padding:12px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }

  /* ---------- Home ---------- */
  .logo{
    font-size:15px;
    font-weight:800;
    letter-spacing:1px;
    line-height:1.25;
    color:var(--text);
  }
  .logo small{
    display:block;
    font-size:11px;
    font-weight:600;
    color:var(--accent);
    letter-spacing:2px;
    margin-top:4px;
  }
  .home-copy{ margin-top:34px; }
  .home-illust{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:120px;
  }
  .blob-scene{ position:relative; width:220px; height:150px; }
  .blob{
    position:absolute;
    bottom:0;
    width:96px; height:110px;
    border-radius:48px 48px 44px 44px;
    box-shadow:var(--shadow-sm);
  }
  .blob.a{ left:6px; background:linear-gradient(180deg,#F3A9B6,#EC8CA0); animation:sway 4.5s ease-in-out infinite; }
  .blob.b{ right:6px; background:#FFFFFF; border:1.5px solid var(--border); animation:sway 4.5s ease-in-out infinite .3s; }
  @keyframes sway{ 0%,100%{ transform:translateY(0) rotate(0deg);} 50%{ transform:translateY(-5px) rotate(-1.5deg);} }
  .blob .face{ position:absolute; top:38px; left:0; right:0; display:flex; justify-content:center; gap:14px; }
  .blob .face i{ width:6px; height:6px; border-radius:50%; background:rgba(0,0,0,0.55); display:block; }
  .blob.b .face i{ background:rgba(0,0,0,0.35); }
  .blob .smile{ position:absolute; top:52px; left:50%; transform:translateX(-50%); width:16px; height:8px; border-bottom:2.5px solid rgba(0,0,0,0.4); border-radius:0 0 10px 10px; }
  .heart-between{
    position:absolute; top:6px; left:50%; transform:translateX(-50%);
    font-size:22px;
    animation:heartbeat 1.8s ease-in-out infinite;
  }
  @keyframes heartbeat{ 0%,100%{ transform:translateX(-50%) scale(1);} 50%{ transform:translateX(-50%) scale(1.18);} }
  .home-tagline{ text-align:center; font-size:11px; letter-spacing:2px; color:var(--text-3); font-weight:700; margin-top:14px; }

  /* ---------- Connect ---------- */
  .connect-cards{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-top:28px;
  }
  .person-card{
    flex:1;
    background:var(--card);
    border:1.5px solid var(--border);
    border-radius:var(--r-md);
    padding:20px 12px;
    text-align:center;
    min-height:132px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .avatar-circle{
    width:46px; height:46px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:20px;
  }
  .avatar-circle.me{ background:var(--blue-bg); }
  .avatar-circle.partner{ background:var(--accent-bg); }
  .avatar-circle.empty{ background:#F4F1EC; color:var(--text-3); border:1.5px dashed var(--text-3); }
  .person-card .name-input{
    width:100%;
    border:none;
    background:transparent;
    text-align:center;
    font-size:14.5px;
    font-weight:700;
    color:var(--text);
    font-family:inherit;
    padding:2px 0;
  }
  .person-card .name-input::placeholder{ color:var(--text-3); font-weight:600; }
  .person-card .tag{ font-size:12px; color:var(--text-2); font-weight:600; }
  .person-card.connected{ border-color:var(--accent); background:var(--accent-bg); }
  .mid-heart{ font-size:18px; color:var(--accent); flex-shrink:0; }

  .connect-panel{
    margin-top:24px;
    background:var(--card);
    border:1.5px solid var(--border);
    border-radius:var(--r-md);
    padding:18px;
  }
  .connect-panel .ph-title{ font-size:14.5px; font-weight:700; display:flex; align-items:center; gap:6px; }
  .connect-panel .ph-desc{ font-size:12.5px; color:var(--text-2); margin-top:4px; line-height:1.5; }
  .room-code-box{
    margin-top:14px;
    background:var(--accent-bg);
    border-radius:var(--r-sm);
    padding:14px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .room-code-box .code{ font-size:19px; font-weight:800; letter-spacing:3px; color:var(--accent-deep); }
  .room-code-box .label{ font-size:10.5px; color:var(--accent-deep); font-weight:700; letter-spacing:1.5px; margin-bottom:2px; }
  .copy-mini-btn{
    border:none; background:#fff; color:var(--accent-deep);
    font-size:12.5px; font-weight:700; padding:8px 12px; border-radius:10px; cursor:pointer;
  }
  .code-input-row{ display:flex; gap:8px; margin-top:10px; }
  .code-input-row input{
    flex:1; border:1.5px solid var(--border); border-radius:12px;
    padding:12px 14px; font-size:15px; font-weight:700; letter-spacing:2px; text-align:center;
    font-family:inherit; text-transform:uppercase;
  }
  .code-input-row input:focus{ outline:none; border-color:var(--accent); }
  .waiting-dots-row{ display:flex; align-items:center; gap:6px; margin-top:12px; font-size:12.5px; color:var(--text-2); font-weight:600; }
  .dot-pulse{ width:6px;height:6px;border-radius:50%; background:var(--accent); animation:dotPulse 1s infinite ease-in-out; }
  .dot-pulse:nth-child(2){ animation-delay:.15s;}
  .dot-pulse:nth-child(3){ animation-delay:.3s;}
  @keyframes dotPulse{ 0%,80%,100%{ opacity:.25; transform:scale(.7);} 40%{ opacity:1; transform:scale(1);} }
  .inline-error{ margin-top:10px; font-size:12.5px; color:var(--accent-deep); font-weight:600; }
  .toggle-link{ text-align:center; margin-top:14px; font-size:13px; color:var(--text-2); font-weight:600; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }

  /* ---------- Questions ---------- */
  .progress-row{ display:flex; align-items:center; gap:8px; margin-bottom:2px; }
  .progress-track{ flex:1; height:5px; background:var(--border); border-radius:4px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--accent); border-radius:4px; transition:width .4s cubic-bezier(.22,.61,.36,1); }
  .progress-num{ font-size:12px; color:var(--text-2); font-weight:700; white-space:nowrap; }

  .q-title{ font-size:22px; font-weight:800; margin-top:18px; letter-spacing:-0.3px; }
  .q-desc{ font-size:13.5px; color:var(--text-2); margin-top:6px; line-height:1.5; }

  .q-body{ margin-top:22px; flex:1; }

  .mood-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .mood-card{
    background:var(--card); border:1.5px solid var(--border); border-radius:var(--r-sm);
    padding:16px 12px; text-align:center; cursor:pointer;
    transition:border-color .18s ease, background .18s ease, transform .12s ease;
  }
  .mood-card:active{ transform:scale(0.97); }
  .mood-card .emoji{ font-size:26px; display:block; }
  .mood-card .label{ font-size:13.5px; font-weight:700; margin-top:8px; }
  .mood-card .desc{ font-size:11px; color:var(--text-2); margin-top:2px; line-height:1.4; }
  .mood-card.selected{ border-color:var(--accent); background:var(--accent-bg); }
  .mood-card.wide{ grid-column:1 / -1; }

  .chip-grid{ display:flex; flex-wrap:wrap; gap:9px; }
  .chip{
    background:var(--card); border:1.5px solid var(--border); border-radius:100px;
    padding:10px 15px; font-size:13.5px; font-weight:600; cursor:pointer;
    display:flex; align-items:center; gap:6px;
    transition:border-color .18s ease, background .18s ease, transform .12s ease;
  }
  .chip:active{ transform:scale(0.96); }
  .chip.selected{ border-color:var(--accent); background:var(--accent-bg); color:var(--accent-deep); }
  .chip-counter{ font-size:12.5px; color:var(--text-2); font-weight:700; margin-bottom:14px; display:block; }

  .text-input, .number-input{
    width:100%; border:1.5px solid var(--border); border-radius:var(--r-sm);
    padding:15px 16px; font-size:15.5px; font-weight:600; color:var(--text);
    font-family:inherit; background:var(--card);
  }
  .text-input:focus, .number-input:focus{ outline:none; border-color:var(--accent); }
  .text-input::placeholder, .number-input::placeholder{ color:var(--text-3); font-weight:500; }
  .input-suffix-wrap{ position:relative; }
  .input-suffix{ position:absolute; right:16px; top:50%; transform:translateY(-50%); font-size:14.5px; color:var(--text-2); font-weight:700; }

  .transport-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:9px; }
  .transport-card{
    background:var(--card); border:1.5px solid var(--border); border-radius:var(--r-sm);
    padding:14px 6px; text-align:center; cursor:pointer;
    transition:border-color .18s ease, background .18s ease, transform .12s ease;
  }
  .transport-card:active{ transform:scale(0.96); }
  .transport-card .emoji{ font-size:22px; display:block; }
  .transport-card .label{ font-size:12px; font-weight:700; margin-top:6px; }
  .transport-card.selected{ border-color:var(--accent); background:var(--accent-bg); }

  .time-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .time-card{
    background:var(--card); border:1.5px solid var(--border); border-radius:var(--r-sm);
    padding:22px 12px; text-align:center; cursor:pointer;
    transition:border-color .18s ease, background .18s ease, transform .12s ease;
  }
  .time-card:active{ transform:scale(0.97); }
  .time-card .emoji{ font-size:28px; display:block; }
  .time-card .label{ font-size:14.5px; font-weight:700; margin-top:8px; }
  .time-card.selected{ border-color:var(--accent); background:var(--accent-bg); }

  /* ---------- Waiting ---------- */
  .wait-hero{ display:flex; align-items:center; justify-content:center; gap:0; margin-top:8px; }
  .phone-icon{
    width:76px; height:96px; border-radius:16px; background:var(--card);
    border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:30px;
    box-shadow:var(--shadow-sm);
  }
  .phone-icon.you{ background:var(--blue-bg); border-color:var(--blue-bg); transform:translateX(8px) rotate(-4deg); }
  .phone-icon.partner{ background:var(--accent-bg); border-color:var(--accent-bg); transform:translateX(-8px) rotate(4deg); animation:jiggle 1.6s ease-in-out infinite; }
  @keyframes jiggle{ 0%,100%{ transform:translateX(-8px) rotate(4deg);} 50%{ transform:translateX(-8px) rotate(1deg);} }
  .wait-spark{ font-size:20px; margin:0 -6px; z-index:2; }
  .wait-title{ text-align:center; font-size:20px; font-weight:800; margin-top:26px; line-height:1.4; }
  .wait-sub{ text-align:center; font-size:13.5px; color:var(--text-2); margin-top:8px; line-height:1.55; }

  .status-cards{ display:flex; gap:12px; margin-top:30px; }
  .status-card{
    flex:1; background:var(--card); border:1.5px solid var(--border); border-radius:var(--r-md);
    padding:18px 10px; text-align:center;
  }
  .status-card .who{ font-size:11px; font-weight:800; letter-spacing:1.5px; color:var(--text-3); }
  .status-card .mark{ font-size:22px; margin:10px 0 4px; }
  .status-card .state{ font-size:12.5px; font-weight:700; }
  .status-card.done{ border-color:var(--accent); }
  .status-card.done .state{ color:var(--accent-deep); }
  .status-card.pending .state{ color:var(--text-2); }

  .partner-mini{
    margin-top:auto;
    background:var(--card); border:1.5px solid var(--border); border-radius:var(--r-sm);
    padding:14px 16px; display:flex; align-items:center; gap:10px; margin-top:24px;
  }
  .partner-mini .av{ width:34px; height:34px; border-radius:50%; background:var(--accent-bg); display:flex; align-items:center; justify-content:center; font-size:15px; }
  .partner-mini .txt{ font-size:13px; font-weight:700; color:var(--text-2); flex:1; }
  .partner-mini .heart{ color:var(--accent); font-size:14px; }

  /* ---------- Matching ---------- */
  .match-stage{ display:flex; flex-direction:column; align-items:center; margin-top:20px; }
  .match-circles{ position:relative; width:100%; height:120px; display:flex; align-items:center; justify-content:center; }
  .m-circle{
    position:absolute; width:74px; height:74px; border-radius:50%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:10.5px; font-weight:800; color:#fff; letter-spacing:0.5px;
  }
  .m-circle .h{ font-size:14px; margin-top:2px; }
  .m-circle.you{ background:var(--blue); left:calc(50% - 92px); animation:convergeYou 1.1s cubic-bezier(.3,.6,.3,1) forwards; }
  .m-circle.partner{ background:var(--accent); right:calc(50% - 92px); animation:convergePartner 1.1s cubic-bezier(.3,.6,.3,1) forwards; }
  @keyframes convergeYou{ from{ left:calc(50% - 92px);} to{ left:calc(50% - 46px);} }
  @keyframes convergePartner{ from{ right:calc(50% - 92px);} to{ right:calc(50% - 46px);} }
  .m-center-heart{
    position:absolute; font-size:16px; opacity:0; animation:heartPop .4s ease forwards; animation-delay:1s;
  }
  @keyframes heartPop{ from{opacity:0; transform:scale(.4);} to{opacity:1; transform:scale(1);} }

  .tag-float{
    position:absolute; background:#fff; border:1.5px solid var(--border); border-radius:100px;
    padding:5px 11px; font-size:11.5px; font-weight:700; color:var(--text);
    opacity:0; box-shadow:var(--shadow-sm);
    animation:tagRise .7s ease forwards;
  }
  @keyframes tagRise{ from{ opacity:0; transform:translateY(10px) scale(.85);} to{ opacity:1; transform:translateY(0) scale(1);} }

  .match-title{ text-align:center; font-size:19px; font-weight:800; margin-top:20px; line-height:1.4; }

  .match-checklist{ margin-top:30px; width:100%; }
  .check-item{
    display:flex; align-items:center; gap:10px; font-size:13.5px; font-weight:600; color:var(--text-2);
    padding:10px 0; opacity:0; animation:fadeIn .4s ease forwards;
  }
  .check-item:nth-child(1){ animation-delay:.2s; }
  .check-item:nth-child(2){ animation-delay:1.1s; }
  .check-item:nth-child(3){ animation-delay:1.9s; }
  .check-item .ck{ width:18px; height:18px; border-radius:50%; background:var(--accent-bg); color:var(--accent-deep); display:flex; align-items:center; justify-content:center; font-size:11px; flex-shrink:0; }

  .match-dots{ display:flex; gap:6px; justify-content:center; margin-top:auto; padding-top:20px; }
  .match-dots span{ width:6px; height:6px; border-radius:50%; background:var(--border); }
  .match-dots span.active{ background:var(--accent); }

  /* ---------- Result ---------- */
  .result-head{ display:flex; align-items:flex-start; justify-content:space-between; }
  .result-eyebrow{ font-size:11px; font-weight:800; letter-spacing:2px; color:var(--accent-deep); }
  .result-title{ font-size:23px; font-weight:800; margin-top:4px; letter-spacing:-0.4px; }
  .result-sub{ font-size:13px; color:var(--text-2); margin-top:4px; font-weight:600; }

  .best-card{
    margin-top:20px; background:var(--card); border:1.5px solid var(--border); border-radius:var(--r-lg);
    overflow:hidden; box-shadow:var(--shadow-sm); animation:popIn .4s ease;
    flex-shrink:0;
  }
  .best-photo{
    height:132px; width:100%;

    { value:"쇼핑하기", emoji:"🛍️" }, { value:"자연", emoji:"🌳" }, { value:"드라이브", emoji:"🚗" },

  var ACTIVITY_META = {

    "자연":{icon:"🌳", name:"자연 산책", duration:60},
    "드라이브":{icon:"🚗", name:"드라이브", duration:90},
    "만들기":{icon:"🛠️", name:"만들기 체험", duration:90},
    "사진 찍기":{icon:"📸", name:"포토 스팟", duration:40},
    "노래/공연":{icon:"🎤", name:"공연 관람", duration:100},
    "체험하기":{icon:"🧩", name:"체험 활동", duration:90},
    "집에서":{icon:"🏠", name:"집에서 휴식", duration:120},
    "걷기":{icon:"🚶", name:"산책", duration:50}
  };

  var QUESTIONS = [
    { id:"mood", title:"오늘의 기분은?", desc:"오늘 어떤 데이트를 하고 싶나요?", type:"single", options:MOOD_OPTIONS },
    { id:"activities", title:"오늘 뭐하고 놀까?", desc:"최대 3개까지 골라주세요.", type:"multiple", max:3, options:ACTIVITY_OPTIONS },
    { id:"location", title:"어디에서 만날까요?", desc:"만나고 싶은 지역을 입력해주세요.", type:"text", placeholder:"예: 청주 성안길" },
    { id:"transport", title:"어떻게 이동할까요?", desc:"오늘의 이동 수단을 선택해주세요.", type:"transport", options:TRANSPORT_OPTIONS },
    { id:"budget", title:"오늘 예산은?", desc:"1인 기준 예산을 입력해주세요.", type:"number", placeholder:"50,000", suffix:"원" },
    { id:"time", title:"언제 만날까요?", desc:"오전, 오후 중 골라주세요.", type:"time", options:TIME_OPTIONS }
  ];

  /* ============================================================
     STATE
  ============================================================ */
  var initialAnswers = function(){ return { mood:null, activities:[], location:"", transport:null, budget:null, time:null }; };

  var state = {
    screen:"home",
    setupNeeded: !SUPABASE_CONFIGURED,

    // Real room/participant identity (Phase 1)
    room:null,              // { id, code, status, expires_at }
    me:null,                // { id, nickname, role }  role: 'host' | 'guest'
    inviteInfo:null,        // temp room+host info shown on the invite screen before joining
    inviteNickname:"",
    connecting:false,
    connected:false,        // true once both host & guest participants exist

    nickname:"",            // nickname draft on the connect screen (host side, before room creation)
    codeInputValue:"",
    connectMode:null,       // 'link' | 'code' | null

    qIndex:0,
    answers: initialAnswers(),
    partner:{ id:null, nickname:"상대방", connected:false, completed:false, answers:null },
    userCompleted:false,
    results:null,
    selectedResultType:"bestMatch",
    error:null,
    modal:null,            // {type:'detail', which:'yourPick'|'newExperience'}
    _timers:[],
    _realtimeChannel:null
  };

  function persist(){
    try{
      localStorage.setItem("dateMakerUser", JSON.stringify({
        room: state.room,
        me: state.me,
        nickname: state.nickname,
        answers: state.answers,
        qIndex: state.qIndex,
        userCompleted: state.userCompleted
      }));
    }catch(e){ /* storage unavailable — ignore silently */ }
  }
  function restore(){
    try{
      var raw = localStorage.getItem("dateMakerUser");
      if(!raw) return null;
      var saved = JSON.parse(raw);
      if(saved && saved.answers){
        state.room = saved.room || null;
        state.me = saved.me || null;
        state.nickname = saved.nickname || "";
        state.answers = Object.assign(initialAnswers(), saved.answers);
        state.qIndex = saved.qIndex || 0;
        state.userCompleted = !!saved.userCompleted;
      }
      return saved;
    }catch(e){ return null; }
  }
  function clearSession(){
    state.room = null;
    state.me = null;
    state.connected = false;
    state.partner = { id:null, nickname:"상대방", connected:false, completed:false, answers:null };
    try{ localStorage.removeItem("dateMakerUser"); }catch(e){}
  }

  function clearTimers(){
    state._timers.forEach(function(t){ clearTimeout(t); });
    state._timers = [];
  }
  function later(fn, ms){ var t = setTimeout(fn, ms); state._timers.push(t); return t; }

  function showError(msg, retry){
    state.error = { msg: msg, retry: retry || null };
    render();
  }
  function dismissError(){ state.error = null; render(); }

  /* ============================================================
     UTILS
  ============================================================ */
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }
  function randomRoomId(){
    var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    var out = "";
    for(var i=0;i<6;i++) out += chars[Math.floor(Math.random()*chars.length)];
    return out;
  }
  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
    }
    return a;
  }
  function randomChoice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function dedupe(arr){
    var seen = {}, out = [];
    arr.forEach(function(x){ if(x && !seen[x]){ seen[x]=1; out.push(x); } });
    return out;
  }
  function formatMoney(n){ return Number(n||0).toLocaleString("ko-KR"); }
  function formatTime(hour, min){
    hour = ((hour % 24) + 24) % 24;
    var hh = String(hour).padStart(2,"0");
    var mm = String(min).padStart(2,"0");
    return hh + ":" + mm;
  }

  /* ============================================================
     SUPABASE — REAL ROOM / PARTICIPANT ACCESS (Phase 1)
  ============================================================ */
  function isRoomExpired(room){
    if(!room || !room.expires_at) return false;
    return new Date(room.expires_at).getTime() <= Date.now();
  }

  // Create a room + insert the host participant. Retries once on a code collision.
  async function sbCreateRoomAsHost(nickname){
    var code = randomRoomId();
    var roomRow = await supa.from("rooms").insert({ code: code }).select().single();
    if(roomRow.error){
      // Extremely unlikely code collision — retry once with a fresh code.
      var retryCode = randomRoomId();
      roomRow = await supa.from("rooms").insert({ code: retryCode }).select().single();
      if(roomRow.error) throw roomRow.error;
    }
    var room = roomRow.data;
    var hostRow = await supa.from("participants")
      .insert({ room_id: room.id, nickname: nickname, role: "host" })
      .select().single();
    if(hostRow.error) throw hostRow.error;
    return { room: room, me: hostRow.data };
  }

  // Look up a room by its 6-char code, plus whichever participants already joined.
  async function sbFetchRoomByCode(code){
    var roomRes = await supa.from("rooms").select("*").eq("code", code).maybeSingle();
    if(roomRes.error) throw roomRes.error;
    if(!roomRes.data) return null;
    var partsRes = await supa.from("participants").select("*").eq("room_id", roomRes.data.id);
    if(partsRes.error) throw partsRes.error;
    return { room: roomRes.data, participants: partsRes.data || [] };
  }

  async function sbFetchParticipants(roomId){
    var res = await supa.from("participants").select("*").eq("room_id", roomId);
    if(res.error) throw res.error;
    return res.data || [];
  }

  // Join an existing room as guest. Fails gracefully if a guest slot is already taken
  // (the DB's unique(room_id, role) constraint is the real 2-person guarantee).
  async function sbJoinRoomAsGuest(roomId, nickname){
    var res = await supa.from("participants")
      .insert({ room_id: roomId, nickname: nickname, role: "guest" })
      .select().single();
    if(res.error){
      if(res.error.code === "23505"){ // unique_violation
        var err = new Error("이미 다른 분이 참여한 방이에요.");
        err.code = "ROOM_FULL";
        throw err;
      }
      throw res.error;
    }
    return res.data;
  }

  async function sbUpdateRoomStatus(roomId, status){
    try{ await supa.from("rooms").update({ status: status }).eq("id", roomId); }
    catch(e){ /* non-critical — ignore */ }
  }

  function sbSubscribeToPartner(roomId, onPartnerJoined){
    if(!supa) return null;
    var channel = supa.channel("room-" + roomId)
      .on("postgres_changes",
          { event:"INSERT", schema:"public", table:"participants", filter:"room_id=eq." + roomId },
          function(payload){ onPartnerJoined(payload.new); })
      .subscribe(function(status, err){
        if(err) console.error("[DATE MAKER] realtime subscribe error (participants insert):", status, err);
        else console.log("[DATE MAKER] realtime channel status (participants insert):", status);
      });
    return channel;
  }

  function sbUnsubscribe(){
    if(state._realtimeChannel && supa){
      try{ supa.removeChannel(state._realtimeChannel); }catch(e){}
      state._realtimeChannel = null;
    }
  }

  /* ============================================================
     SUPABASE — REAL ANSWERS / COMPLETION SYNC (Phase 2)
  ============================================================ */
  async function sbUpsertAnswers(participantId, answers){
    var payload = {
      participant_id: participantId,
      mood: answers.mood,
      activities: answers.activities || [],
      location: answers.location,
      transport: answers.transport,
      budget: answers.budget,
      time: answers.time,
      updated_at: new Date().toISOString()
    };
    var res = await supa.from("answers").upsert(payload, { onConflict: "participant_id" });
    if(res.error) throw res.error;
  }

  async function sbMarkCompleted(participantId){
    var res = await supa.from("participants").update({ completed_at: new Date().toISOString() }).eq("id", participantId);
    if(res.error) throw res.error;
  }

  async function sbFetchAnswers(participantId){
    var res = await supa.from("answers").select("*").eq("participant_id", participantId).maybeSingle();
    if(res.error) throw res.error;
    return res.data;
  }

  async function sbFetchParticipantById(participantId){
    var res = await supa.from("participants").select("*").eq("id", participantId).maybeSingle();
    if(res.error) throw res.error;
    return res.data;
  }

  // Listens for the partner's row flipping completed_at — this is how the
  // waiting screen detects a real person finishing their answers.
  function sbSubscribeToParticipantUpdates(roomId, onUpdate){
    if(!supa) return null;
    var channel = supa.channel("room-updates-" + roomId)
      .on("postgres_changes",
          { event:"UPDATE", schema:"public", table:"participants", filter:"room_id=eq." + roomId },
          function(payload){ onUpdate(payload.new); })
      .subscribe(function(status, err){
        if(err) console.error("[DATE MAKER] realtime subscribe error (participants updates):", status, err);
        else console.log("[DATE MAKER] realtime channel status (participants updates):", status);
      });
    return channel;
  }

  function answersRowToAnswers(row){
    if(!row) return null;
    return { mood: row.mood, activities: row.activities || [], location: row.location, transport: row.transport, budget: row.budget, time: row.time };
  }

  /* ============================================================
     SUPABASE — RESULTS / SELECTED_RESULT (Phase 3)
  ============================================================ */
  async function sbFetchResults(roomId){
    var res = await supa.from("results").select("*").eq("room_id", roomId).maybeSingle();
    if(res.error) throw res.error;
    return res.data;
  }

  async function sbInsertResults(roomId, computed){
    var payload = {
      room_id: roomId,
      best_match: computed.bestMatch,
      your_pick: computed.yourPick,
      new_experience: computed.newExperience,
      meta: computed.meta
    };
    var res = await supa.from("results").insert(payload);
    if(res.error) throw res.error;
  }

  async function sbUpsertResults(roomId, computed){
    var payload = {
      room_id: roomId,
      best_match: computed.bestMatch,
      your_pick: computed.yourPick,
      new_experience: computed.newExperience,
      meta: computed.meta
    };
    var res = await supa.from("results").upsert(payload, { onConflict: "room_id" });
    if(res.error) throw res.error;
  }

  function resultsRowToResult(row){
    return {
      bestMatch: row.best_match,
      yourPick: row.your_pick,
      newExperience: row.new_experience,
      meta: row.meta || {}
    };
  }

  async function sbConfirmSelectedResult(roomId, participantId, resultType){
    var payload = {
      room_id: roomId,
      participant_id: participantId,
      result_type: resultType,
      confirmed_at: new Date().toISOString()
    };
    var res = await supa.from("selected_result").upsert(payload, { onConflict: "room_id" });
    if(res.error) throw res.error;
  }

  // Whoever gets here first computes + stores the result; whoever arrives
  // second (the other participant) just reads the same stored result back,
  // so both people always see an identical set of 3 courses.
  async function getOrCreateResults(){
    if(!supa || !state.room){
      return computeMatch(state.answers, state.partner.answers || {});
    }
    var existing = await sbFetchResults(state.room.id);
    if(existing) return resultsRowToResult(existing);

    var computed = computeMatch(state.answers, state.partner.answers || {});
    try{
      await sbInsertResults(state.room.id, computed);
      return computed;
    }catch(e){
      if(e && e.code === "23505"){ // partner's insert won the race — read theirs instead
        var row = await sbFetchResults(state.room.id);
        if(row) return resultsRowToResult(row);
      }
      throw e;
    }
  }

  /* ============================================================
     MATCHING ALGORITHM
  ============================================================ */
  function buildSchedule(activityList, startHour){
    var hour = startHour, min = 0;
    var schedule = [];
    activityList.forEach(function(act){
      var meta = ACTIVITY_META[act] || { icon:"✨", name:act, duration:60 };
      schedule.push({ time: formatTime(hour,min), icon: meta.icon, name: meta.name });
      var total = min + meta.duration;
      hour += Math.floor(total/60);
      min = total % 60;
    });
    if(activityList.indexOf("먹기") === -1 && hour >= 17 && hour < 22){
      schedule.push({ time: formatTime(hour,min), icon:"🍴", name:"저녁 식사" });
    }
    return schedule;
  }

  function buildReasons(opts){
    var reasons = [];
    if(opts.common.length){
      reasons.push("두 사람 모두 '" + opts.common[0] + "'을(를) 선택했어요.");
    } else {
      reasons.push("서로 다른 취향을 조율해서 새로운 조합을 만들었어요.");
    }
    if(opts.timeMatch){
      reasons.push("두 사람 모두 " + opts.time + " 데이트를 원했어요.");
    } else {
      reasons.push("시간대가 달라 " + opts.time + "로 맞춰 조율했어요.");
    }
    reasons.push(opts.transport + " 이동을 기준으로 동선을 짰어요.");
    reasons.push("두 사람의 예산 범위(1인 약 " + formatMoney(opts.budget) + "원) 안에서 구성했어요.");
    return reasons;
  }

  function computeMatch(userA, userB){
    var actsA = userA.activities || [];
    var actsB = userB.activities || [];
    var common = actsA.filter(function(a){ return actsB.indexOf(a) !== -1; });
    var onlyA = actsA.filter(function(a){ return common.indexOf(a) === -1; });
    var onlyB = actsB.filter(function(a){ return common.indexOf(a) === -1; });

    var timeMatch = userA.time === userB.time;
    var time = timeMatch ? userA.time : "오후";
    var startHour = time === "오전" ? 10 : 14;

    var budget = Math.round(((Number(userA.budget)||50000) + (Number(userB.budget)||50000)) / 2 / 1000) * 1000;

    var transport;
    if(userA.transport === userB.transport) transport = userA.transport || "자동차";
    else if(userA.transport === "상관없음") transport = userB.transport;
    else if(userB.transport === "상관없음") transport = userA.transport;
    else transport = userA.transport || userB.transport || "자동차";

    var location;
    if(userA.location && userB.location){
      location = userA.location === userB.location ? userA.location : (userA.location + " · " + userB.location + " 사이");
    } else {
      location = userA.location || userB.location || "오늘의 동네";
    }

    var allActs = ACTIVITY_OPTIONS.map(function(o){ return o.value; });

    // BEST MATCH: common first, then one pick from each individual side
    var bestActs = dedupe(common.concat(onlyA.slice(0,1)).concat(onlyB.slice(0,1)));
    if(bestActs.length === 0) bestActs = ["카페","걷기"];
    bestActs = bestActs.slice(0,4);

    var bestMatch = {
      title: (location.split(" ")[0] || "오늘") + " " + (common[0] || bestActs[0]) + (bestActs[1] ? " & " + bestActs[1] : "") + " 코스",
      description: common.length
        ? ("두 사람이 모두 선택한 '" + common[0] + "'와(과) " + time + " 시간을 중심으로 만들었어요.")
        : ("서로 다른 취향을 자연스럽게 엮은 " + time + " 코스예요."),
      schedule: buildSchedule(bestActs, startHour),
      reasons: buildReasons({ common:common, timeMatch:timeMatch, time:time, transport:transport, budget:budget })
    };

    // YOUR PICK: leans toward userA's individual preferences
    var yourPickActs = dedupe(onlyA.concat(common.slice(0,1)));
    if(yourPickActs.length === 0) yourPickActs = dedupe(actsA.slice(0,2));
    if(yourPickActs.length === 0) yourPickActs = ["카페"];
    yourPickActs = yourPickActs.slice(0,4);
    var yourPick = {
      title: (userA.mood || "당신") + "의 취향을 담은 " + (yourPickActs[0] || "카페") + " 코스",
      description: "조금 더 " + (userA.nickname || "당신") + "님의 선택을 반영한 데이트예요.",
      schedule: buildSchedule(yourPickActs, startHour),
      reasons: [
        "'" + (yourPickActs[0]||"") + "' 등 당신이 고른 취향을 더 많이 반영했어요.",
        "이동수단(" + transport + ")과 예산 범위는 그대로 지켰어요.",
        time + " 시간대에 맞춰 일정을 짰어요."
      ]
    };

    // NEW EXPERIENCE: activities neither picked
    var pool = shuffle(allActs.filter(function(a){ return actsA.indexOf(a) === -1 && actsB.indexOf(a) === -1; }));
    var newActs = pool.slice(0,2);
    if(newActs.length < 2){
      newActs = dedupe(newActs.concat(shuffle(allActs).slice(0, 2-newActs.length)));
    }
    var newExperience = {
      title: "평소와 다른 " + newActs[0] + " 데이트",
      description: "두 사람 모두 골라본 적 없는 새로운 조합으로 만든 코스예요.",
      schedule: buildSchedule(newActs, startHour),
      reasons: [
        "두 사람 모두 선택하지 않았던 '" + newActs[0] + "'을(를) 시도해봐요.",
        "가끔은 새로운 활동이 데이트를 더 특별하게 만들어줘요.",
        time + " · " + transport + " 조건은 동일하게 맞췄어요."
      ]
    };

    return {
      bestMatch: bestMatch, yourPick: yourPick, newExperience: newExperience,
      meta: { common: common, onlyA: onlyA, onlyB: onlyB, time: time, budget: budget, transport: transport, location: location }
    };
  }

    var v = state.answers[q.id];

    if(q.type === "multiple") return v && v.length > 0;
    if(q.type === "text") return v && v.trim().length > 0;
    if(q.type === "number") return v && Number(v) > 0;
    if(q.type === "transport") return !!v;
    if(q.type === "time") return !!v;
    return true;
  }

        return '<div class="transport-card' + (isSel?' selected':'') + '" onclick="DM.selectSingle(\'transport\',\'' + opt.value + '\')">' +
          '<span class="emoji">' + opt.emoji + '</span><div class="label">' + opt.value + '</div>' +
        '</div>';

      body = '<div class="input-suffix-wrap">' +
        '<input class="number-input" type="text" inputmode="numeric" placeholder="' + esc(q.placeholder||"") + '" value="' + esc(val) + '" oninput="DM.onBudget(this)" style="padding-right:44px;" />' +
        '<span class="input-suffix">' + q.suffix + '</span>' +

          '<span class="emoji">' + opt.emoji + '</span><div class="label">' + opt.value + '</div>' +

    return (
      '<div class="screen">' +
        '<div class="topbar"><button class="back-btn" onclick="DM.prevQuestion()">←</button></div>' +

          '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%;"></div></div>' +

      '</div>'
    );

  /* ============================================================
     ACTIONS (exposed as window.DM)
  ============================================================ */
  var DM = {};

  DM.goHome = function(){
    clearTimers();
    sbUnsubscribe();
    clearSession();
    state.screen = "home";
    state.error = null;
    state.inviteInfo = null;
    state.connectMode = null;
    state.nickname = "";
    try{
      var url = new URL(window.location.href);
      url.searchParams.delete("room");
      window.history.replaceState({}, "", url.toString());
    }catch(e){}
    render();
  };

  DM.goConnect = function(){
    state.screen = "connect";
    render();
  };

  DM.recheckSetup = function(){ window.location.reload(); };

  DM.onNickname = function(el){
    state.nickname = el.value;
    persist();
  };

  DM.switchMode = function(mode){
    state.connectMode = mode;
    state.error2 = null;
    render();
    later(function(){
      var input = app.querySelector(".connect-panel input");
      if(input) input.focus();
    }, 30);
  };

  function inviteLinkFor(code){
    return window.location.origin + window.location.pathname + "?room=" + code;
  }

  // Host: create a real room row + host participant, then listen for the guest to join.
  DM.createRoom = async function(){
    if(!supa){ showError("Supabase 설정이 필요해요.", null); return; }
    if(!state.nickname || !state.nickname.trim()){
      state.nickname = "나";
    }
    state.connecting = true;
    render();
    try{
      var created = await sbCreateRoomAsHost(state.nickname.trim());
      state.room = created.room;
      state.me = { id: created.me.id, nickname: created.me.nickname, role: "host" };
      state.connecting = false;
      persist();
      render();
      startHostRealtime();
    }catch(e){
      state.connecting = false;
      showError("방을 만드는 중 문제가 생겼어요. 다시 시도해주세요.", DM.createRoom);
    }
  };

  function startHostRealtime(){
    if(!state.room) return;
    // In case a guest already joined while we were offline/refreshing, check once up front.
    sbFetchParticipants(state.room.id).then(function(parts){
      var guest = parts.filter(function(p){ return p.role === "guest"; })[0];
      if(guest) onGuestJoined(guest);
    }).catch(function(){ /* non-fatal; realtime subscription still covers new joins */ });

    sbUnsubscribe();
    state._realtimeChannel = sbSubscribeToPartner(state.room.id, function(newParticipant){
      if(newParticipant.role === "guest") onGuestJoined(newParticipant);
    });
  }

  function onGuestJoined(guestRow){
    state.connected = true;
    state.partner = { id: guestRow.id, nickname: guestRow.nickname, connected:true, completed: !!guestRow.completed_at, answers:null };
    sbUpdateRoomStatus(state.room.id, "ready");
    persist();
    render();
  }

  DM.onCodeInput = function(el){
    state.codeInputValue = el.value.toUpperCase();
  };

  // Host or manual "코드로 참여하기": look up a room by its 6-char code.
  DM.submitCodeAsGuest = async function(){
    var code = (state.codeInputValue||"").trim().toUpperCase();
    if(code.length !== 6){
      state.error2 = "올바르지 않은 코드예요. 6자리 코드를 확인해주세요.";
      render();
      return;
    }
    if(!supa){ showError("Supabase 설정이 필요해요.", null); return; }
    state.error2 = null;
    render();
    try{
      var found = await sbFetchRoomByCode(code);
      if(!found){
        state.error2 = "존재하지 않는 방이에요. 코드를 다시 확인해주세요.";
        render();
        return;
      }
      enterInviteFlow(found);
    }catch(e){
      showError("방을 확인하는 중 문제가 생겼어요. 다시 시도해주세요.", DM.submitCodeAsGuest);
    }
  };

  DM.copyLink = function(){
    if(!state.room) return;
    var link = inviteLinkFor(state.room.code);
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(link).catch(function(){});
    }
    var btn = event && event.target;
    if(btn){
      var original = btn.textContent;
      btn.textContent = "복사됨!";
      later(function(){ btn.textContent = original; }, 1400);
    }
  };

  // --- Invite flow: someone opened ?room=CODE, or typed a code manually ---
  function enterInviteFlow(found){
    var host = found.participants.filter(function(p){ return p.role === "host"; })[0];
    var guest = found.participants.filter(function(p){ return p.role === "guest"; })[0];

    if(isRoomExpired(found.room)){
      state.inviteInfo = { type:"error", message:"이 링크는 만료됐어요. 새로운 데이트를 시작해주세요." };
      state.screen = "invite";
      render();
      return;
    }
    if(found.room.status === "completed"){
      state.inviteInfo = { type:"error", message:"이미 끝난 데이트예요." };
      state.screen = "invite";
      render();
      return;
    }
    if(guest && (!state.me || state.me.id !== guest.id)){
      state.inviteInfo = { type:"error", message:"이미 두 사람이 모두 참여한 방이에요." };
      state.screen = "invite";
      render();
      return;
    }
    state.inviteInfo = { type:"ok", room: found.room, host: host || null };
    state.screen = "invite";
    render();
  }

  DM.showInviteNickname = function(){
    state.screen = "invite-nickname";
    render();
    later(function(){
      var input = app.querySelector("input.text-input");
      if(input) input.focus();
    }, 30);
  };

  DM.backToInvite = function(){
    state.screen = "invite";
    render();
  };

  DM.onInviteNickname = function(el){
    state.inviteNickname = el.value;
    var btn = app.querySelector(".btn-primary.accent");
    if(btn) btn.disabled = !(state.inviteNickname && state.inviteNickname.trim().length > 0);
  };

  // Guest: insert the second participant row. The DB's unique(room_id, role)
  // constraint is what actually guarantees the 2-person cap.
  DM.joinAsGuest = async function(){
    var nickname = (state.inviteNickname || "").trim();
    if(!nickname) return;
    if(!supa){ showError("Supabase 설정이 필요해요.", null); return; }
    var info = state.inviteInfo;
    if(!info || info.type !== "ok") return;
    try{
      var me = await sbJoinRoomAsGuest(info.room.id, nickname);
      state.room = info.room;
      state.me = { id: me.id, nickname: me.nickname, role: "guest" };
      state.nickname = nickname;
      state.partner = { id: info.host ? info.host.id : null, nickname: info.host ? info.host.nickname : "상대방", connected:true, completed: info.host ? !!info.host.completed_at : false, answers:null };
      state.connected = true;
      persist();
      state.screen = "guest-ready";
      render();
    }catch(e){
      if(e && e.code === "ROOM_FULL"){
        state.inviteInfo = { type:"error", message:"이미 다른 분이 참여한 방이에요." };
        state.screen = "invite";
        render();
      } else {
        showError("연결 중 문제가 생겼어요. 다시 시도해주세요.", DM.joinAsGuest);
      }
    }
  };

  DM.guestStart = function(){
    if(state.room) sbUpdateRoomStatus(state.room.id, "in_progress");
    DM.goQuestions();
  };

  DM.hostStart = function(){
    if(state.room) sbUpdateRoomStatus(state.room.id, "in_progress");
    sbUnsubscribe();
    DM.goQuestions();
  };

  DM.goQuestions = function(){
    state.screen = "questions";
    render();
  };

  DM.selectSingle = function(field, value){
    state.answers[field] = value;
    persist();
    render();
  };

  DM.toggleActivity = function(value){
    var arr = state.answers.activities || [];
    var idx = arr.indexOf(value);
    if(idx !== -1){
      arr.splice(idx,1);
    } else {
      if(arr.length >= 3) return;
      arr.push(value);
    }
    state.answers.activities = arr;
    persist();
    render();
  };

  DM.onLocation = function(el){
    state.answers.location = el.value;
    persist();
    render();
  };

  DM.onBudget = function(el){
    var digits = el.value.replace(/[^0-9]/g, "");
    state.answers.budget = digits ? parseInt(digits,10) : null;
    var formatted = digits ? formatMoney(digits) : "";
    el.value = formatted;
    persist();
    var btn = app.querySelector(".btn-primary.accent");
    if(btn) btn.disabled = !isCurrentValid();
  };

  DM.prevQuestion = function(){
    if(state.qIndex > 0){
      state.qIndex -= 1;
      persist();
      render();
    } else {
      state.screen = "connect";
      render();
    }
  };

  function syncAnswersToServer(){
    if(!supa || !state.me) return;
    sbUpsertAnswers(state.me.id, state.answers).catch(function(){ /* non-fatal — next sync point will retry */ });
  }

  DM.nextQuestion = async function(){
    if(!isCurrentValid()) return;
    if(state.qIndex < QUESTIONS.length - 1){
      state.qIndex += 1;
      persist();
      render();
      syncAnswersToServer();
    } else {
      await finishQuestions();
    }
  };

  async function finishQuestions(){
    state.userCompleted = true;
    persist();
    if(supa && state.me){
      try{
        await sbUpsertAnswers(state.me.id, state.answers);
        await sbMarkCompleted(state.me.id);
      }catch(e){
        console.error("[DATE MAKER] finishQuestions failed:", e);
        showError("답변을 저장하는 중 문제가 생겼어요. 다시 시도해주세요.", finishQuestions);
        return;
      }
    }
    DM.goWaiting();
  }

  DM.goWaiting = function(){
    state.screen = "waiting";
    render();
    startWaitingForPartnerCompletion();
  };

  async function startWaitingForPartnerCompletion(){
    if(!supa || !state.room){
      showError("연결 정보를 찾을 수 없어요.", null);
      return;
    }
    try{
      // The partner may have already finished before we did — check once up front.
      if(state.partner.id){
        var row = await sbFetchParticipantById(state.partner.id);
        if(row && row.completed_at){
          await onPartnerCompletedAnswers(row);
          return;
        }
      }
    }catch(e){ console.warn("[DATE MAKER] pre-check for partner completion failed, falling back to realtime:", e); }

    sbUnsubscribe();
    state._realtimeChannel = sbSubscribeToParticipantUpdates(state.room.id, function(updatedRow){
      if(state.me && updatedRow.id === state.me.id) return; // ignore our own row's updates
      if(updatedRow.completed_at){
        onPartnerCompletedAnswers(updatedRow);
      }
    });
  }

  async function onPartnerCompletedAnswers(participantRow){
    sbUnsubscribe();
    try{
      var answersRow = await sbFetchAnswers(participantRow.id);
      state.partner.id = participantRow.id;
      state.partner.nickname = participantRow.nickname || state.partner.nickname;
      state.partner.completed = true;
      state.partner.answers = answersRowToAnswers(answersRow);
      render();
      later(function(){ DM.goMatching(); }, 1100);
    }catch(e){
      console.error("[DATE MAKER] onPartnerCompletedAnswers failed:", e);
      showError("상대방 답변을 불러오지 못했어요. 다시 시도해주세요.", function(){ onPartnerCompletedAnswers(participantRow); });
    }
  }

  DM.cancelWaiting = function(){
    clearTimers();
    sbUnsubscribe();
    // Only cancels waiting for the partner's answers — the real room connection stays intact.
    state.screen = "connect";
    render();
  };

  DM.goMatching = async function(){
    state.screen = "matching";
    render();
    try{
      var result = await getOrCreateResults();
      later(function(){
        state.results = result;
        state.selectedResultType = "bestMatch";
        DM.goResult();
      }, 2700);
    }catch(e){
      console.error("[DATE MAKER] goMatching failed:", e);
      showError("데이트 코스를 만드는 중 문제가 생겼어요.", DM.goMatching);
    }
  };

  DM.goResult = function(){
    state.screen = "result";
    render();
  };

  DM.rematch = async function(){
    state.screen = "matching";
    render();
    try{
      var computed = computeMatch(state.answers, state.partner.answers || {});
      if(supa && state.room){
        await sbUpsertResults(state.room.id, computed);
      }
      later(function(){
        state.results = computed;
        state.selectedResultType = "bestMatch";
        DM.goResult();
      }, 1800);
    }catch(e){
      console.error("[DATE MAKER] rematch failed:", e);
      showError("다시 조합하는 중 문제가 생겼어요.", DM.rematch);
    }
  };

  DM.confirmDate = async function(){
    var btn = app.querySelector(".btn-primary.accent");
    var original = btn ? btn.innerHTML : null;
    if(btn){ btn.innerHTML = "결정하는 중…"; btn.disabled = true; }
    try{
      if(supa && state.room && state.me){
        await sbConfirmSelectedResult(state.room.id, state.me.id, state.selectedResultType || "bestMatch");
        await sbUpdateRoomStatus(state.room.id, "completed");
      }
      if(btn){ btn.innerHTML = "결정 완료! 좋은 데이트 되세요 💗"; }
      later(function(){ if(btn){ btn.innerHTML = original; btn.disabled = false; } }, 2200);
    }catch(e){
      console.error("[DATE MAKER] confirmDate failed:", e);
      if(btn){ btn.innerHTML = original; btn.disabled = false; }
      showError("데이트를 확정하는 중 문제가 생겼어요. 다시 시도해주세요.", DM.confirmDate);
    }
  };

  DM.shareResult = function(){
    var text = "오늘의 데이트: " + (state.results ? state.results.bestMatch.title : "DATE MAKER");
    if(navigator.share){
      navigator.share({ title:"DATE MAKER", text:text }).catch(function(){});
    } else if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).catch(function(){});
      showError("결과가 클립보드에 복사됐어요.");
      later(dismissError, 1800);
    }
  };

  DM.openDetail = function(which){
    state.modal = { which: which };
    render();
  };
  DM.closeModal = function(){
    state.modal = null;
    render();
  };
  DM.closeModalBg = function(e){
    if(e.target.classList.contains("modal-overlay")) DM.closeModal();
  };
  DM.chooseAsMain = function(which){
    // swap chosen option into the bestMatch slot for display emphasis
    var chosen = state.results[which];
    state.results.bestMatch = chosen;
    state.selectedResultType = which;
    state.modal = null;
    render();
  };

  DM.retryError = function(){
    var retry = state.error && state.error.retry;
    state.error = null;
    render();
    if(typeof retry === "function") retry();
  };

  window.DM = DM;

  /* ============================================================
     INIT
  ============================================================ */
  async function resumeAsHost(){
    try{
      var parts = await sbFetchParticipants(state.room.id);
      var guest = parts.filter(function(p){ return p.role === "guest"; })[0];
      if(guest){
        state.connected = true;
        state.partner = { id: guest.id, nickname: guest.nickname, connected:true, completed: !!guest.completed_at, answers:null };
      }
      if(state.userCompleted){
        state.screen = "waiting";
        render();
        startWaitingForPartnerCompletion();
        return;
      }
      if(guest && (state.qIndex > 0 || state.answers.mood)){
        state.screen = "questions";
        render();
        return;
      }
      state.screen = "connect";
      render();
      startHostRealtime();
    }catch(e){
      state.screen = "connect";
      showError("방 정보를 불러오지 못했어요.", null);
    }
  }

  async function resumeAsGuest(){
    try{
      var parts = await sbFetchParticipants(state.room.id);
      var host = parts.filter(function(p){ return p.role === "host"; })[0];
      state.partner = { id: host ? host.id : null, nickname: host ? host.nickname : "상대방", connected:true, completed: host ? !!host.completed_at : false, answers:null };
      state.connected = true;
      if(state.userCompleted){
        state.screen = "waiting";
        render();
        startWaitingForPartnerCompletion();
        return;
      }
      if(state.qIndex > 0 || state.answers.mood){
        state.screen = "questions";
      } else {
        state.screen = "guest-ready";
      }
      render();
    }catch(e){
      showError("방 정보를 불러오지 못했어요.", null);
      state.screen = "home";
      render();
    }
  }

  async function init(){
    if(!SUPABASE_CONFIGURED || !supa){
      state.screen = "setup";
      render();
      return;
    }

    var saved = restore();
    var urlParams = new URLSearchParams(window.location.search);
    var roomCodeParam = urlParams.get("room");

    // Reopening a link for a room we're already part of — just resume the session.
    if(saved && state.room && state.me && roomCodeParam && state.room.code === roomCodeParam.toUpperCase()){
      if(isRoomExpired(state.room)){ clearSession(); state.screen = "home"; render(); return; }
      if(state.me.role === "host") return resumeAsHost();
      return resumeAsGuest();
    }

    // No room in the URL, but we have a saved session — resume it.
    if(!roomCodeParam && saved && state.room && state.me){
      if(isRoomExpired(state.room)){ clearSession(); state.screen = "home"; render(); return; }
      if(state.me.role === "host") return resumeAsHost();
      return resumeAsGuest();
    }

    // Fresh visit via an invite link.
    if(roomCodeParam){
      state.inviteInfo = { type:"loading" };
      state.screen = "invite";
      render();
      try{
        var found = await sbFetchRoomByCode(roomCodeParam.toUpperCase());
        if(!found){
          state.inviteInfo = { type:"error", message:"존재하지 않는 초대 링크예요." };
          render();
          return;
        }
        enterInviteFlow(found);
      }catch(e){
        state.inviteInfo = { type:"error", message:"초대 정보를 불러오지 못했어요." };
        render();
      }
      return;
    }

    // Plain first visit.
    render();
  }

  window.addEventListener("beforeunload", function(){ sbUnsubscribe(); });

  init();
})();
</script>
